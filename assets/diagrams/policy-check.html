<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Halberd intercepts a destructive request</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        color-scheme: light dark;
        --paper: #fbfcfe;
        --panel: #eef2f7;
        --ink: #0d1322;
        --muted: #384452;
        --rule: #5e6e80;
        --wax: #a3252e;
        --font-body: "Manrope", system-ui, sans-serif;
        --font-mark: "Cormorant Garamond", Georgia, serif;
        --font-code: ui-monospace, "DejaVu Sans Mono", monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #0a0e14;
          --panel: #131a23;
          --ink: #f0f4f8;
          --muted: #9aabbe;
          --rule: #9aabbe;
          --wax: #ff8894;
        }
      }
      html, body { margin: 0; overflow-x: clip; background: var(--paper); }
      .diagram-container { width: 100%; max-width: 960px; min-width: 0; margin-inline: auto; }
      svg { display: block; width: 100%; height: auto; }
      .compact { display: none; }
      text { fill: var(--ink); font-family: var(--font-body); font-weight: 500; }
      .title { font-size: 32px; font-weight: 700; }
      .heading { font-size: 22px; font-weight: 700; }
      .code { font-family: var(--font-code); font-size: 20px; }
      .note { font-size: 18px; fill: var(--muted); }
      .name { font-family: var(--font-mark); font-size: 32px; font-weight: 600; }
      .paper { fill: var(--paper); }
      .panel { fill: var(--panel); stroke: var(--rule); stroke-width: 1.5; }
      .ink { fill: var(--ink); }
      .boundary { fill: none; stroke: var(--rule); stroke-width: 1; stroke-dasharray: 4 8; }
      .route { fill: none; stroke: var(--rule); stroke-width: 2; }
      .refused { fill: none; stroke: var(--wax); stroke-width: 2; }
      .wax { fill: var(--wax); }
      .metal { fill: var(--ink); }
      .etch { fill: none; stroke: var(--rule); stroke-width: 1.5; }
      .compact .heading { font-size: 26px; }
      .compact .code, .compact .note { font-size: 24px; }
      @media (max-width: 600px) {
        .wide { display: none; }
        .compact { display: block; }
      }
    </style>
  </head>
  <body>
    <main class="diagram-container">
      <svg class="wide" id="policy-check-wide" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="policy-check-wide-title policy-check-wide-desc">
        <title id="policy-check-wide-title">Halberd intercepts a destructive database request</title>
        <desc id="policy-check-wide-desc">The assistant asks to read ten student records and to erase the students table. The read request passes through Halberd to the database tool. The DROP TABLE request stops before the policy boundary and returns JSON-RPC error -32000.</desc>
        <defs>
          <marker id="policy-check-wide-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" class="ink"/></marker>
          <marker id="policy-check-wide-stop" markerWidth="12" markerHeight="16" refX="6" refY="8" orient="auto"><path d="M 6 0 V 16" class="refused"/></marker>
        </defs>
        <rect width="960" height="520" class="paper"/>
        <text x="32" y="56" class="title">Halberd intercepts the erase request.</text>
        <text x="32" y="92" class="note">Your policy decides which calls reach the tool.</text>
        <path d="M 552 168 V 188 M 552 236 V 460" class="boundary"/>
        <path d="M 328 208 H 768" class="route" marker-end="url(#policy-check-wide-arrow)"/>
        <path d="M 328 392 H 512" class="refused" marker-end="url(#policy-check-wide-stop)"/>
        <rect x="620" y="170" width="96" height="28" class="paper"/>
        <rect x="380" y="354" width="104" height="28" class="paper"/>
        <text x="32" y="172" class="heading">Read 10 student records</text>
        <text x="32" y="208" class="code">SELECT id, name</text>
        <text x="32" y="236" class="code">FROM students LIMIT 10</text>
        <text x="668" y="190" class="note" text-anchor="middle">Allowed</text>
        <text x="552" y="148" class="name" text-anchor="middle">Halberd</text>
        <text x="32" y="352" class="heading">Erase the students table</text>
        <text x="32" y="392" class="code">DROP TABLE students</text>
        <text x="432" y="376" class="heading wax" text-anchor="middle">Refused</text>
        <text x="384" y="428" class="code wax">-32000</text>
        <g transform="translate(552 360) scale(0.58)" aria-hidden="true" class="metal">
          <rect x="-6" y="-160" width="12" height="320" rx="2"/>
          <polygon points="0,-200 -10,-160 10,-160"/>
          <path d="M -10 -140 Q -75 -120 -95 -70 Q -85 -55 -60 -50 L -10 -55 Z"/>
          <path d="M 10 -140 Q 50 -120 65 -90 Q 55 -75 35 -75 L 10 -90 Z"/>
          <rect x="-22" y="-50" width="44" height="14" rx="3"/>
          <circle cx="0" cy="155" r="10"/>
        </g>        <g aria-hidden="true">
          <path d="M 768 172 V 264 C 768 288 896 288 896 264 V 172 Z" class="panel"/>
          <ellipse cx="832" cy="172" rx="64" ry="20" class="panel"/>
          <path d="M 768 204 C 768 228 896 228 896 204 M 768 236 C 768 260 896 260 896 236" class="etch"/>
        </g>
        <text x="832" y="328" class="heading" text-anchor="middle">Database tool</text>
        <text x="832" y="360" class="note" text-anchor="middle">Only the lookup arrives</text>
        <text x="32" y="496" class="note">The erase command is stopped before the tool can execute it.</text>
      </svg>
      <svg class="compact" id="policy-check-compact" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 792" role="img" aria-labelledby="policy-check-compact-title policy-check-compact-desc">
        <title id="policy-check-compact-title">Halberd intercepts a destructive database request</title>
        <desc id="policy-check-compact-desc">The assistant asks to read ten student records and to erase the students table. The read request passes through Halberd to the database tool. The DROP TABLE request stops before the policy boundary and returns JSON-RPC error -32000.</desc>
        <defs>
          <marker id="policy-check-compact-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" class="ink"/></marker>
          <marker id="policy-check-compact-stop" markerWidth="12" markerHeight="16" refX="6" refY="8" orient="auto"><path d="M 6 0 V 16" class="refused"/></marker>
        </defs>
        <rect width="480" height="792" class="paper"/>
        <text x="24" y="52" class="title">Halberd intercepts</text>
        <text x="24" y="88" class="title">the erase request.</text>
        <path d="M 24 480 H 396 M 456 480 H 464" class="boundary"/>
        <path d="M 324 184 H 424 Q 432 184 432 192 V 640 Q 432 648 424 648 H 408" class="route" marker-end="url(#policy-check-compact-arrow)"/>
        <path d="M 180 352 V 432" class="refused" marker-end="url(#policy-check-compact-stop)"/>
        <rect x="340" y="140" width="108" height="34" class="paper"/>
        <text x="24" y="152" class="heading">Read 10 student records</text>
        <text x="24" y="184" class="code">SELECT id, name</text>
        <text x="24" y="212" class="code">FROM students LIMIT 10</text>
        <text x="394" y="168" class="note" text-anchor="middle">Allowed</text>
        <text x="24" y="292" class="heading">Erase the students table</text>
        <text x="24" y="328" class="code">DROP TABLE students</text>
        <text x="24" y="400" class="heading wax">Refused</text>
        <text x="24" y="432" class="code wax">-32000</text>
        <text x="24" y="528" class="name">Halberd</text>
        <g transform="translate(248 512) scale(0.4)" aria-hidden="true" class="metal">
          <rect x="-6" y="-160" width="12" height="320" rx="2"/>
          <polygon points="0,-200 -10,-160 10,-160"/>
          <path d="M -10 -140 Q -75 -120 -95 -70 Q -85 -55 -60 -50 L -10 -55 Z"/>
          <path d="M 10 -140 Q 50 -120 65 -90 Q 55 -75 35 -75 L 10 -90 Z"/>
          <rect x="-22" y="-50" width="44" height="14" rx="3"/>
          <circle cx="0" cy="155" r="10"/>
        </g>        <g aria-hidden="true">
          <path d="M 280 616 V 708 C 280 732 408 732 408 708 V 616 Z" class="panel"/>
          <ellipse cx="344" cy="616" rx="64" ry="20" class="panel"/>
          <path d="M 280 648 C 280 672 408 672 408 648 M 280 680 C 280 704 408 704 408 680" class="etch"/>
        </g>
        <text x="24" y="672" class="note">Only the lookup</text>
        <text x="24" y="704" class="note">reaches the tool.</text>
        <text x="344" y="764" class="heading" text-anchor="middle">Database tool</text>
      </svg>
    </main>
  </body>
</html>
