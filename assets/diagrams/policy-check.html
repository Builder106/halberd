<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halberd checks each call before forwarding it</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
:root { color-scheme: light dark; --bg: #ffffff; --ink: #1f2328; --muted: #59636e; --edge: #59636e; --box: #8c959f; --group: #d1d9e0; --groupfill: #f6f8fa; --accent: #0969da; }
@media (prefers-color-scheme: dark) { :root { --bg: #0d1117; --ink: #f0f6fc; --muted: #9198a1; --edge: #9198a1; --box: #656c76; --group: #3d444d; --groupfill: #151b23; --accent: #4493f8; } }
html, body { margin: 0; background: var(--bg); }
main { max-width: 720px; margin: 0 auto; }
svg { display: block; width: 100%; height: auto; }
text { font-family: "IBM Plex Sans", system-ui, sans-serif; fill: var(--ink); }
.mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
.muted { fill: var(--muted); }
.accent-text { fill: var(--accent); }
.bg, .halo { fill: var(--bg); }
.node { fill: var(--bg); stroke-width: 1.25; }
.node.box { stroke: var(--box); }
.node.accent { stroke: var(--accent); stroke-width: 2; }
.group { fill: var(--groupfill); stroke: var(--group); }
.boundary { fill: none; stroke: var(--box); stroke-dasharray: 6 6; }
.edge { fill: none; stroke: var(--edge); stroke-width: 1.5; }
.edge.accent { stroke: var(--accent); stroke-width: 2; }
.edge.dashed { stroke-dasharray: 6 5; }
.lifeline { fill: none; stroke: var(--group); stroke-dasharray: 4 5; }
.tip { fill: var(--edge); }
.tip-accent { fill: var(--accent); }
</style>
</head>
<body>
<main>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 288" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Halberd checks each call before forwarding it</title>
<desc id="diagram-desc">The AI assistant sends a tools/call request to the Halberd proxy. The policy engine evaluates it. An allowed request goes on to the upstream MCP server. A refused request goes back to the assistant as a JSON-RPC error and never reaches the server. Both decisions are recorded on the audit bus.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="tip" d="M0,0 L10,5 L0,10 Z"/></marker>
<marker id="arrow-accent" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="tip-accent" d="M0,0 L10,5 L0,10 Z"/></marker>
</defs>
<rect class="bg" width="720" height="288"/>
<rect class="boundary" x="226" y="16" width="250" height="256" rx="8"/>
<text x="240" y="40" font-size="14" class="muted" font-weight="600">Halberd proxy</text>
<rect class="node box" x="16" y="52" width="120" height="67" rx="6"/>
<text x="30" y="79" font-size="16" font-weight="600">Assistant</text>
<text x="30" y="100" font-size="14" class="muted">MCP client</text>
<rect class="node accent" x="246" y="52" width="210" height="67" rx="6"/>
<text x="260" y="79" font-size="16" font-weight="600">Policy check</text>
<text x="260" y="100" font-size="14" class="muted mono">EvaluateRequest</text>
<rect class="node box" x="246" y="186" width="210" height="67" rx="6"/>
<text x="260" y="213" font-size="16" font-weight="600">Audit bus</text>
<text x="260" y="234" font-size="14" class="muted">every decision</text>
<rect class="node box" x="536" y="52" width="168" height="67" rx="6"/>
<text x="550" y="79" font-size="16" font-weight="600">MCP server</text>
<text x="550" y="100" font-size="14" class="muted">the real tool</text>
<path class="edge" d="M136,72.1 L246,72.1" marker-end="url(#arrow)"/>
<rect class="halo" x="144.3" y="51.1" width="93.4" height="19"/>
<text x="191" y="64.1" font-size="14" class="label mono" text-anchor="middle">tools/call</text>
<path class="edge dashed" d="M246,102.25 L136,102.25" marker-end="url(#arrow)"/>
<rect class="halo" x="159.56" y="81.25" width="62.88" height="19"/>
<text x="191" y="94.25" font-size="14" class="label" text-anchor="middle">refused</text>
<path class="edge accent" d="M456,85.5 L536,85.5" marker-end="url(#arrow-accent)"/>
<rect class="halo" x="464.56" y="64.5" width="62.88" height="19"/>
<text x="496" y="77.5" font-size="14" class="label accent-text" text-anchor="middle">allowed</text>
<path class="edge" d="M351,119 L351,186" marker-end="url(#arrow)"/>
<rect class="halo" x="355" y="144.5" width="62.88" height="19"/>
<text x="359" y="157.5" font-size="14" class="label">records</text>
</svg>
</main>
