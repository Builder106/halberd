<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><title id="card-title">Halberd: every tool call meets this line first</title><desc id="card-description">A policy proxy for MCP. A DROP TABLE call stops at Halberd's line before reaching the server.</desc><rect id="paper" x="0" y="0" width="1200" height="630" fill="#F1F2F4" /><line id="policy-line" x1="500" y1="0" x2="500" y2="630" stroke="#0D0F12" stroke-width="4" /><g id="brand-mark" transform="translate(476 0)"><path id="mark-spike" d="M24 0 L26.2 23 L21.8 23 Z" fill="#0D0F12" /><path id="mark-blade" d="M25.5 17 C31 17 36 15 40.5 10.5 C46.5 19.5 46.5 34 41.5 42.5 C36.5 37.5 31 35.5 25.5 35.5 Z" fill="#0D0F12" /><path id="mark-hook" d="M22.5 20.5 C17 21.5 11.5 24 5.5 29.5 C11.5 27.5 17 27 22.5 27.5 Z" fill="#0D0F12" /><rect id="mark-shaft" x="22.5" y="14" width="3" height="58" fill="#0D0F12" /></g><text id="assistant-label" x="48" y="58" fill="#0D0F12" font-family="Arial, sans-serif" font-size="20" font-weight="700">Assistant</text><text id="halberd-label" x="536" y="58" fill="#0D0F12" font-family="Arial, sans-serif" font-size="20" font-weight="700">Halberd</text><text id="server-label" x="1152" y="58" fill="#0D0F12" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="end">Server</text><text id="headline-first" x="48" y="255" fill="#0D0F12" font-family="Arial, sans-serif" font-size="69" font-weight="800" letter-spacing="-3">Every tool</text><text id="headline-second" x="48" y="329" fill="#0D0F12" font-family="Arial, sans-serif" font-size="69" font-weight="800" letter-spacing="-3">call meets this</text><text id="headline-third" x="48" y="403" fill="#0D0F12" font-family="Arial, sans-serif" font-size="69" font-weight="800" letter-spacing="-3">line first.</text><text id="intro-first" x="548" y="224" fill="#0D0F12" font-family="Arial, sans-serif" font-size="34" font-weight="700">A policy proxy for MCP</text><text id="intro-second" x="548" y="269" fill="#585F69" font-family="Arial, sans-serif" font-size="25">See what reached the server.</text><rect id="request-envelope" x="548" y="319" width="604" height="173" fill="#E6E8EB" stroke="#C6CBD2" stroke-width="2" rx="2" /><text id="request-method" x="576" y="363" fill="#0D0F12" font-family="monospace" font-size="22">tools/call  query</text><rect id="matched-highlight" x="574" y="386" width="286" height="37" fill="#FFE14A" /><text id="request-sql" x="576" y="414" fill="#0D0F12" font-family="monospace" font-size="24">DROP TABLE students</text><text id="request-verdict" x="576" y="465" fill="#0D0F12" font-family="Arial, sans-serif" font-size="22" font-weight="700">Refused before forwarding</text><text id="server-absence" x="548" y="548" fill="#585F69" font-family="Arial, sans-serif" font-size="24" font-style="italic">Nothing reached the server.</text></svg>
